# yaml-language-server: $schema=../../../../../../rules/rules.schema.json
# Rules for the starter web app's features/portal (inherits rules/base.rules.yaml). Exemptions are a platform-owner decision.
# After editing, run: node tools/rules-engine/compile.mjs
schemaVersion: 1
module: WebPortal
kind: angular
description: "Starter web public portal (module 15 UI): landing, service guide, FAQ with search, contact form and the privacy and terms pages, all public and bilingual. The FAQ, service guide, privacy and terms sections come from GET api/portal/content/{page} (anonymous, bilingual plain text, loading/empty/error page feedback); the contact form posts through ApiService to api/portal/contact-messages and shows the CU-YYYY-NNN receipt and problem+json field errors inline."
mayDependOn: []
mustNotDependOn: []
