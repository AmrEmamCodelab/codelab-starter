<app-portal-content-pattern [sections]="tocSections()">
  <dga-portal-page-header
    portalHeader
    [title]="keys.Title | t"
    [subtitle]="keys.Subtitle | t"
    [breadcrumbs]="breadcrumbs()"
    [breadcrumbLabel]="common.BreadcrumbLabel | t"
  />

  <app-portal-content-state [status]="content.status()" [empty]="content.empty()" (retry)="content.retry()" />

  @for (section of content.sections(); track section.id) {
    <section class="guide__section" [portalSection]="section.anchor" [attr.aria-labelledby]="'guide-' + section.anchor">
      <h2 class="guide__heading" [id]="'guide-' + section.anchor">{{ section.title }}</h2>
      @for (paragraph of section.paragraphs; track $index) {
        <p class="guide__paragraph">{{ paragraph }}</p>
      }
    </section>
  }

  <section class="guide__section guide__help" [portalSection]="ids.Help" aria-labelledby="guide-help">
    <h2 class="guide__heading" id="guide-help">{{ keys.HelpTitle | t }}</h2>
    <p class="guide__paragraph">{{ keys.HelpBody | t }}</p>
    <div class="guide__help-links">
      <a class="guide__help-link" [routerLink]="links.Faq">
        <dga-icon name="question" size="sm" />
        <span>{{ keys.HelpFaq | t }}</span>
      </a>
      <a class="guide__help-link" [routerLink]="links.Contact">
        <dga-icon name="email" size="sm" />
        <span>{{ keys.HelpContact | t }}</span>
      </a>
    </div>
  </section>
</app-portal-content-pattern>
