<app-portal-content-pattern [sections]="sections()">
  <dga-portal-page-header
    portalHeader
    [title]="document().titleKey | t"
    [subtitle]="document().subtitleKey | t"
    [breadcrumbs]="breadcrumbs()"
    [breadcrumbLabel]="common.BreadcrumbLabel | t"
  />

  <app-portal-content-state [status]="content.status()" [empty]="content.empty()" (retry)="content.retry()" />

  @for (section of content.sections(); track section.id) {
    <section class="legal__section" [portalSection]="section.anchor" [attr.aria-labelledby]="'legal-' + section.anchor">
      <h2 class="legal__heading" [id]="'legal-' + section.anchor">{{ section.title }}</h2>
      @for (paragraph of section.paragraphs; track $index) {
        <p class="legal__paragraph">{{ paragraph }}</p>
      }
    </section>
  }

  <p portalLastUpdated class="legal__contact">
    {{ common.LegalQuestions | t }}
    <a class="legal__contact-link" [routerLink]="contactLink">{{ common.LegalContactLink | t }}</a>
  </p>
</app-portal-content-pattern>
