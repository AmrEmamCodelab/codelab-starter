# yaml-language-server: $schema=../../../../../../rules/rules.schema.json
# Rules for the starter web app's features/service-requests (inherits rules/base.rules.yaml). Exemptions are a platform-owner decision.
# After editing, run: node tools/rules-engine/compile.mjs
schemaVersion: 1
module: WebServiceRequests
kind: angular
description: "Starter web Service Request sample (deletable with tools/remove-module.ps1 -Name ServiceRequests): data/ holds the typed client over ApiService, the wire models (WireId ids, status ints, action and permission keys), the 3 wizard steps, the hand-mirrored validators with the FE/BE parity fixture, and the detail-card adapter; requester/ and staff/ hold the screens on the wizard, requester-detail, work-queue and staff-detail patterns. Imports only core, shared, patterns and @codelab/ng-dga (ESLint boundaries)."
mayDependOn: []
mustNotDependOn: []
