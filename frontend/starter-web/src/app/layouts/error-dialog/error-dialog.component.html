@if (store.messageKey(); as messageKey) {
  <dga-error-dialog
    open
    [title]="keys.Title | t"
    [message]="messageKey | t"
    [referenceLabel]="keys.Reference | t"
    [referenceCode]="store.referenceCode()"
    [copyLabel]="keys.Copy | t"
    [copiedLabel]="keys.Copied | t"
    [closeLabel]="keys.Close | t"
    (closed)="dismiss()"
  />
}
