# yaml-language-server: $schema=../../../../../rules/rules.schema.json
# Rules for the starter web app's layouts (inherits rules/base.rules.yaml). Exemptions are a platform-owner decision.
# After editing, run: node tools/rules-engine/compile.mjs
schemaVersion: 1
module: WebLayouts
kind: angular
description: "Starter web layouts: the staff app-shell (header, permission-gated navigation, page outlet), the public portal-shell and the signed-in requester-shell (digital stamp strip, DGA header, footer), the notifications menu and feed (presentational, fed by a NotificationsSource), the language switcher, the user profile menu and the app-wide error dialog. Layouts import only core, shared and @codelab/ng-dga; they hold no API calls and no feature policy."
mayDependOn: []
mustNotDependOn: []
