# yaml-language-server: $schema=../../../../../rules/rules.schema.json
# Rules for the starter web app's page patterns (inherits rules/base.rules.yaml). Exemptions are a platform-owner decision.
# After editing, run: node tools/rules-engine/compile.mjs
schemaVersion: 1
module: WebPatterns
kind: angular
description: "Starter web page patterns: the 8 page bases screens are built on (admin list + pager with the editor dialog over native <dialog>, tree editor, work queue, staff detail with the decision dialog, multi-step wizard, requester detail with the status tracker, portal content, landing dashboard) and their pure helpers. Live examples at /showcase, docs in docs/design/patterns/. Patterns import only core and @codelab/ng-dga (ESLint boundaries), hold no API calls and no feature policy."
mayDependOn: []
mustNotDependOn: []
