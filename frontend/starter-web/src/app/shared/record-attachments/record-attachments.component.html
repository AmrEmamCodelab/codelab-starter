<section
  *hasPermission="permissionKeys.View"
  class="record-attachments"
  [attr.data-testid]="testIds.Root"
  [attr.aria-busy]="store.loadState() === loadStates.Loading ? 'true' : null"
>
  <dga-page-feedback [state]="feedback()" [moveFocus]="false" [dismissLabel]="keys.Dismiss | t" (dismissed)="store.dismissFeedback()" />

  @switch (store.loadState()) {
    @case (loadStates.Loading) {
      <p class="record-attachments__loading" role="status" [attr.data-testid]="testIds.Loading">{{ keys.Loading | t }}</p>
    }
    @case (loadStates.Failed) {
      <div class="record-attachments__failed">
        <p class="record-attachments__failed-text">{{ keys.LoadFailed | t }}</p>
        <dga-button variant="secondary-outline" size="sm" data-public-action [attr.data-testid]="testIds.Retry" (click)="store.retry()">
          {{ keys.Retry | t }}
        </dga-button>
      </div>
    }
    @default {
      @for (section of sections(); track section.key) {
        <div class="record-attachments__type" [attr.data-testid]="testIds.Type" [attr.data-type-key]="section.key">
          <ng-container *hasPermission="permissionKeys.Upload; else viewOnly">
            <ng-container *ngTemplateOutlet="control; context: { $implicit: section, editable: !readonly() }" />
          </ng-container>
          <ng-template #viewOnly>
            <ng-container *ngTemplateOutlet="control; context: { $implicit: section, editable: false }" />
          </ng-template>
        </div>
      } @empty {
        <p class="record-attachments__empty" [attr.data-testid]="testIds.NoTypes">{{ keys.NoTypes | t }}</p>
      }
    }
  }
</section>

<ng-template #control let-section let-editable="editable">
  <dga-file-upload
    [label]="section.label"
    [hint]="section.hint"
    [browseLabel]="keys.Browse | t"
    [dropLabel]="keys.Drop | t"
    [accept]="section.accept"
    [maxFiles]="section.maxFiles"
    [required]="section.required"
    [requiredLabel]="keys.Required | t"
    [missingText]="section.missingText"
    [items]="section.items"
    [statusLabels]="statusLabels()"
    [referenceCodeLabel]="keys.ReferenceCodeLabel | t"
    [error]="rejectionFor(section)"
    [readonly]="!editable"
    downloadable
    [downloadLabel]="keys.Download | t"
    [removeLabel]="editable && canRemove() ? (keys.Remove | t) : null"
    (filesSelected)="onFilesSelected(section, $event)"
    (download)="onDownload($event)"
    (remove)="onRemove($event)"
  />
</ng-template>
