<div class="file-picker">
  <span class="file-picker__label" [id]="labelId">{{ labelKey() | t }}</span>
  <dga-file-upload
    [attr.data-testid]="testIds.Choose"
    [ariaLabelledBy]="labelId"
    [browseLabel]="keys.Choose | t"
    [accept]="accept()"
    [disabled]="disabled()"
    (filesSelected)="picked($event)"
  >
    <span class="file-picker__name" aria-live="polite" [attr.data-testid]="testIds.Name">
      @if (fileName(); as name) {
        <bdi>{{ name }}</bdi>
      } @else {
        {{ keys.None | t }}
      }
    </span>
  </dga-file-upload>
</div>
