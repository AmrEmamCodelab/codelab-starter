@if (state(); as current) {
  <div
    #banner
    class="dga-page-feedback"
    tabindex="-1"
    [attr.role]="role()"
    [attr.data-kind]="current.kind"
    [attr.aria-labelledby]="hasTitle() ? titleId : null"
  >
    @if (icon(); as name) {
      <dga-icon class="dga-page-feedback__icon" [name]="name" size="md" />
    }
    <div class="dga-page-feedback__content">
      @if (hasTitle()) {
        <p class="dga-page-feedback__title" [id]="titleId">{{ current.title }}</p>
      }
      <p class="dga-page-feedback__message">{{ current.message }}</p>
    </div>
    @if (dismissible()) {
      <dga-button class="dga-page-feedback__dismiss" variant="transparent" size="sm" iconOnly leadIcon="close" [label]="dismissLabel()" (click)="dismiss()" />
    }
  </div>
}
