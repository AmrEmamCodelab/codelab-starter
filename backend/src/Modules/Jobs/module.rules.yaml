# yaml-language-server: $schema=../../../../rules/rules.schema.json
# Rules for the Jobs module (inherits rules/base.rules.yaml). Written by hand to the module anatomy.
# After editing, run: node tools/rules-engine/compile.mjs
schemaVersion: 1
module: Jobs
kind: dotnet
description: "Background jobs (module 6b): the catalog of every IJob a module registers with AddStarterJob, the run history in schema jobs (actor SYSTEM), manual runs and recurring schedules on Hangfire (schema hangfire, no dashboard, a job server per node behind Jobs:Enabled), and the built-in outbox-drain and security-replay-purge jobs."
mayDependOn: [StarterDomain, StarterApplication, StarterInfrastructure, CodelabSecurity, CodelabObservability, CodelabErrors]
mustNotDependOn: [Identity, Access, Users, Settings, Lookups, Audit]
required:
  - id: jobs.thin-endpoints
    statement: Every endpoint is a thin controller action in Api/ that calls one Application use case, carries [HasPermission] with a JobsPermissionKeys constant and maps the Outcome with OutcomeResults (or JobsResults for 202).
    enforcedBy: [contract-test, review]
  # Tested by the module's runner tests and Jobs/JobRunActorTests (integration); no coverage gate runs yet (ADR-012).
  - id: jobs.system-actor
    statement: Every run executes inside ISystemActorScope and is recorded with the actor SystemActor.Name; a job never acts as a user account or a role, and the administrator who triggers a run is recorded only as TriggeredBy.
    enforcedBy: [review]
  - id: jobs.no-exception-text-stored
    statement: A failed run stores only the classified code (IFailureCodeResolver) and its reference code, never an exception message or stack trace; the exception goes to the one log line.
    enforcedBy: [review]
  - id: jobs.scheduler-in-infrastructure
    statement: Hangfire types appear only in Infrastructure/Scheduling; Application sees the IJobQueue and IJobRunLock ports and the kernel IJob.
    enforcedBy: [review]
  - id: jobs.no-dashboard
    statement: The Hangfire dashboard is never mapped; operators read runs on the admin Jobs screen and failures in the log.
    enforcedBy: [review]
forbidden:
  - id: jobs.no-module-reference
    description: Jobs come to this module through the kernel IJob port (AddStarterJob); a reference to another module couples them and breaks removing one.
    pattern: '(?<![A-Za-z0-9_])Modules[.](?:Identity|Access|Users|Settings|Lookups|Audit|Notifications|Portal)(?![A-Za-z0-9_])'
    appliesTo: ["**/*.cs", "**/*.csproj"]
    fix: Register the job in its own module with services.AddStarterJob<TJob>() (Starter.Infrastructure.Jobs).
recipes: [docs/recipes/add-endpoint.md]
