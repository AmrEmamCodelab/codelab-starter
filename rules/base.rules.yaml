# yaml-language-server: $schema=./rules.schema.json
#
# Base rules: inherited by EVERY module (backend and frontend). A module adds to these in its own
# module.rules.yaml; it can drop a base rule only through an `exemptions` entry with a reason.
# After editing, run `node tools/rules-engine/compile.mjs` and commit the regenerated files.
# CI (build.ps1 step 3) fails when the compiled output drifts from these sources.
#
# Rule kinds:
#   required       a statement the code must satisfy, with the tools that enforce it (and from which phase)
#   forbidden      a JavaScript regex evaluated against whole files matching `appliesTo`; hooks refuse on error
#   bannedSymbols  Roslyn doc ids written to each .NET module's BannedSymbols.generated.txt (RS0030 = build error)
#   thresholds     size / complexity / coverage limits; modules may override per key
#   analyzers      Roslyn diagnostic severities written to each .NET module's .editorconfig
schemaVersion: 1
ruleSet: base
description: Default rules for every Codelab starter module (architecture, security, clean code, tests, UI).
owners:
  - "@platform-owner"

required:
  # --- Architecture -------------------------------------------------------------------------------
  # Starter.Architecture.Tests (P2): ControllerShape checks sealed, .Api namespace, use-case-only constructor, verb per action.
  - id: base.thin-controllers
    statement: Controllers and endpoints only bind input, call one Application use case and map the result; no business logic, no data access.
    enforcedBy: [architecture-test, review]
    availableFrom: P2
  - id: base.application-ports-only
    statement: Application code depends only on Domain types and ports (interfaces); it never references EF Core, DbContext or infrastructure types.
    enforcedBy: [architecture-test, hook]
    availableFrom: P1
  - id: base.module-boundaries
    statement: A module references another module only when listed in its mayDependOn, and never one listed in mustNotDependOn.
    enforcedBy: [architecture-test, eslint]
    availableFrom: P1
  - id: base.endpoint-contract
    statement: Every endpoint has a permission attribute, takes and returns PublicId (never raw database ids), validates its input with a validator and returns errors as problem+json.
    enforcedBy: [contract-test, review]
    availableFrom: P2
  - id: base.lookups-via-migrations
    statement: Lookup and reference data is created and changed only through EF migrations, never by runtime seeders or manual SQL.
    enforcedBy: [review]
  - id: base.platform-owner-review
    statement: Changes to rules/, packages/, .claude/, the exemptions of any module.rules.yaml, deploy/, .github/, docs/adr/, provenance/, tools/extract/, tools/build.ps1 and the repo-wide build settings need platform-owner review.
    enforcedBy: [codeowners, hook]

  # --- Clean code (user requirement 2026-11-04) ----------------------------------------------------
  - id: base.enums-as-int
    statement: Enums are stored and sent as integers and every enum member has an explicit numeric value (Approved = 3), so reordering never changes stored data; labels come from i18n, never from enum names.
    enforcedBy: [hook, analyzer]
    availableFrom: P1
  - id: base.no-magic-values
    statement: Status ids, role keys, permission keys, error codes, config keys, claim types, route names, cache keys, job ids and limits live in typed constants or options classes; numeric literals other than the allowed ones need a named constant.
    enforcedBy: [hook, analyzer, eslint]
    availableFrom: P1
    settings:
      allowedNumbers: [-1, 0, 1]
      excludeTests: true
  - id: base.clean-code
    statement: Use named arguments for non-obvious parameters, small single-purpose methods, guard clauses instead of nesting, meaningful names, and no dead or commented-out code; size and complexity stay within the module thresholds.
    enforcedBy: [analyzer, review]
    availableFrom: P1
  # Since P2 the scaffold generators emit a test project and tests with every module, endpoint and permission, and the
  # commit-gate agent refuses a change without its tests. The line-coverage gate is still OPEN (ADR-012): the
  # thresholds below (backendLineCoverage, frontendLineCoverage) are declared, but no coverage collector is pinned and
  # no CI step measures coverage yet; until it lands, review enforces the coverage half of this rule.
  - id: base.unit-tests-mandatory
    statement: Every Application use case, validator, workflow transition, domain rule and Angular service or component with logic ships with unit tests, and each module meets its line-coverage threshold.
    enforcedBy: [scaffold, commit-gate, review]
    availableFrom: P2

  # --- Frontend ------------------------------------------------------------------------------------
  - id: base.fe-ui-library
    statement: Screens are built only from @codelab/ng-dga components and the 8 page patterns.
    enforcedBy: [eslint, hook, review]
    availableFrom: P2
  - id: base.fe-no-raw-text
    statement: No user-visible raw text in templates or components; every string is an i18n key present in both ar and en.
    enforcedBy: [i18n-check, hook]
    availableFrom: P2
  - id: base.fe-tokens-logical-css
    statement: Styles use design tokens (CSS variables) and logical properties (inline-start/end) so RTL and LTR both work.
    enforcedBy: [stylelint, hook]
    availableFrom: P2
  # Since P3 two @codelab/ng-tools checks enforce the gating rule (both run in CI; recipe docs/recipes/add-permission.md):
  # the route-table test (assertRoutesGated, in frontend/starter-web/src/app/route-gates.spec.ts) and the template check
  # (codelab-ng-tools permission-gates, run by frontend/starter-web/tools/permission-gates.mjs in `npm run lint`).
  - id: base.fe-permission-gated
    statement: Every route and every action button is gated by a typed permission key (base.fe-routes-gated, base.fe-buttons-gated); the backend endpoint behind it carries [HasPermission] with the same key. Recipe docs/recipes/add-permission.md.
    enforcedBy: [contract-test, scaffold, review]
    availableFrom: P3
  - id: base.fe-routes-gated
    statement: "Every route that renders a page (component or loadComponent) carries data.permission (RouteDataKeys.Permission, a generated PermissionKeys value) on itself or an ancestor, with permissionGuard() (tagged with Symbol.for('codelab.ng-tools.permission-guard'); an untagged guard fails as missing-guard) on itself or an ancestor, or its full path is in PUBLIC_ROUTE_PATHS (src/app/public-routes.ts); redirects are exempt and every lazily loaded child table is passed to the route-gates spec. Fix: add data: { [RouteDataKeys.Permission]: PermissionKeys.<Key> } or, for a page every visitor may open, the public path. Recipe docs/recipes/add-permission.md."
    enforcedBy: [contract-test, review]
    availableFrom: P3
    appliesTo: ["frontend/starter-web/src/app/**/*.routes.ts", "frontend/starter-web/src/app/app.routes.ts"]
  - id: base.fe-buttons-gated
    statement: "Every action element (a <dga-button>; a <button> with any event binding, a submit button or a typeless one in a submitting form; a role=button element with an event binding; any element binding (click) or (confirm), such as a dialog host) in features/**/*.html and in the inline templates of features/**/*.ts carries *hasPermission=\"PermissionKeys.<Key>\" (on itself, on an ancestor element, or [hasPermission] on an <ng-template> wrapper) or an explicit data-public-action for an action every visitor may take. Fix: add the directive with a generated key, or data-public-action. Recipe docs/recipes/add-permission.md."
    enforcedBy: [contract-test, review]
    availableFrom: P3
    appliesTo: ["frontend/starter-web/src/app/features/**/*.html", "frontend/starter-web/src/app/features/**/*.ts"]

forbidden:
  # --- Time ----------------------------------------------------------------------------------------
  - id: base.time-provider
    description: Reading the system clock directly makes time untestable.
    pattern: '\bDateTime(?:Offset)?\.(?:Now|UtcNow|Today)\b'
    appliesTo: ["**/*.cs"]
    fix: Inject TimeProvider and call GetUtcNow() (or GetLocalNow() for display); tests use FakeTimeProvider.
  - id: base.no-thread-sleep
    description: Thread.Sleep blocks a thread and makes waits untestable; it is also a global banned API (RS0030) in Codelab.Build.Sdk.
    pattern: '\bThread[.]Sleep\s*\('
    appliesTo: ["**/*.cs"]
    fix: Use await Task.Delay(delay, timeProvider, cancellationToken) so waits are async and testable.

  # --- Analyzer opt-outs ---------------------------------------------------------------------------
  - id: base.no-analyzer-opt-out
    description: Turning off the banned-API, complexity or clean-code (CLB) analyzers removes a build gate for everyone after you (a gate switch set to anything but true, the .NET analyzers or the analysis level off, by id, by a bare pragma, by category severity, by marking code generated, or by relaxing warnings-as-errors). Codelab.Build.Sdk also fails the build (CODELAB002, CODELAB003).
    pattern: '<Codelab(?:EnableBannedApis|EnableBuildAnalyzers)\b[^>]*>\s*(?!true\s*<)|<EnableNETAnalyzers\b[^>]*>\s*(?!true\s*<)|<AnalysisLevel\w*\b[^>]*>[^<]*\bnone\b|<AnalysisMode\w*\b[^>]*>\s*none\b|<NoWarn>[^<]*\b(?:RS0030|CA1502|CLB\d{4})\b|#\s*pragma\s+warning\s+disable\b[^\r\n]*\b(?:RS0030|CA1502|CLB\d{4})\b|dotnet_diagnostic\.(?:RS0030|CA1502|CLB\d{4})\.severity\s*=\s*(?:none|silent|suggestion)|SuppressMessage\([^)]*\b(?:RS0030|CA1502|CLB\d{4})\b|#\s*pragma\s+warning\s+disable[ \t]*(?://[^\r\n]*)?(?:\r?\n|$)|dotnet_analyzer_diagnostic\.(?:category-[\w.-]+\.)?severity\s*=\s*(?:none|silent|suggestion)|\bgenerated_code\s*=\s*true|<TreatWarningsAsErrors>\s*false|<WarningsNotAsErrors>[^<]*\b(?:RS0030|CA1502|CLB\d{4})\b|<RunAnalyzers(?:DuringBuild)?>\s*false'
    flags: i
    appliesTo: ["**/*.cs", "**/*.csproj", "**/*.props", "**/*.targets", "**/.editorconfig", "**/*.globalconfig"]
    fix: Fix the code instead. A justified exception is a module.rules.yaml exemption with a reason, reviewed by the platform owner.
  # Any diagnostic, not only the gate analyzers: a reliability (CA2xxx) or security (CA5xxx) rule switched off inline
  # skips platform-owner review. Platform-owned files (packages/, the root .editorconfig, Directory.Build.*) are
  # reviewed through CODEOWNERS and stay out of scope; the module's generated .editorconfig is exempt by path.
  # "*/**/.editorconfig" means every .editorconfig except the root one: the hooks read a glob without a slash as
  # "this name in any folder", so a bare ".editorconfig" exclude would exempt every nested file too.
  - id: base.no-inline-suppression
    description: An inline suppression (a pragma, with or without a space after the '#'; the SuppressMessage attribute named anywhere, so an alias such as 'using SM = ...SuppressMessageAttribute' is caught too; a unicode escape outside a string or comment, which could spell that name; a NoWarn or WarningsNotAsErrors entry; WarningLevel 0; or a diagnostic severity set to none, silent or suggestion) switches an analyzer off without platform-owner review.
    pattern: '#\s*pragma\s+warning\s+disable\b|\b(?:Unconditional)?SuppressMessage(?:Attribute)?\b|^[^"''/\r\n]*\\[uU][0-9a-fA-F]{4}|<WarningLevel\b[^>]*>\s*0\s*<|<NoWarn\b[^>]*>(?!\s*(?:\$\(NoWarn\)\s*;?\s*)?<)|<WarningsNotAsErrors\b[^>]*>(?!\s*(?:\$\(WarningsNotAsErrors\)\s*;?\s*)?<)|dotnet_diagnostic\.[\w-]+\.severity\s*=\s*(?:none|silent|suggestion)\b'
    flags: im
    appliesTo: ["**/*.cs", "**/*.csproj", "**/*.props", "**/*.targets", "*/**/.editorconfig", "**/*.globalconfig"]
    excludes: ["packages/**", "**/Directory.Build.*"]
    exemptEmittedFiles: true
    fix: Fix the code. A justified suppression is a module.rules.yaml `analyzers` severity (generated into the module .editorconfig) or an `exemptions` entry, both reviewed by the platform owner.
  # Analyzer configuration that bypasses the module .editorconfig: a ruleset, an extra global or editor config, an
  # AdditionalFiles entry (BannedSymbols, CodeMetricsConfig thresholds) or an extra analyzer (a DiagnosticSuppressor
  # silences any diagnostic). Codelab.Build.Sdk and Directory.Build.* wire these, and both are platform-owned.
  - id: base.no-analyzer-config-redirect
    description: A CodeAnalysisRuleSet, GlobalAnalyzerConfigFiles, EditorConfigFiles, AdditionalFiles or Analyzer item in a project file points the analyzers at configuration (or a suppressor) that no platform owner reviewed, so it can switch any diagnostic off.
    pattern: '<(?:CodeAnalysisRuleSet\w*|GlobalAnalyzerConfigFiles|EditorConfigFiles|AnalyzerConfigFiles|AdditionalFiles|Analyzer)\b|\bOutputItemType\s*=\s*"\s*Analyzer\s*"'
    flags: i
    appliesTo: ["**/*.csproj", "**/*.props", "**/*.targets"]
    excludes: ["packages/**", "**/Directory.Build.*"]
    fix: Remove the item. Analyzer severities and thresholds come from the module.rules.yaml (generated into the module .editorconfig); a new analyzer or analyzer config is a platform-owner change to Codelab.Build.Sdk.
  - id: base.no-ruleset-file
    description: A .ruleset file can set any diagnostic to Action="None"; the starter configures analyzers only through the rules engine, so no ruleset may exist.
    pattern: '^[\s\S]'
    appliesTo: ["**/*.ruleset"]
    fix: Delete the file. Set analyzer severities in the module.rules.yaml, then run node tools/rules-engine/compile.mjs.
  # The ESLint side is also closed by noInlineConfig in the frontend ESLint config; this rule covers stylelint and
  # TypeScript suppressions, which no lint config can refuse.
  - id: base.no-lint-suppression
    description: An eslint, stylelint or TypeScript suppression comment (eslint-disable, an inline eslint config, stylelint-disable, @ts-ignore, @ts-nocheck) switches a frontend gate off without platform-owner review.
    pattern: 'eslint-disable|eslint-enable|/\*\s*eslint\s|stylelint-disable|@ts-ignore|@ts-nocheck'
    appliesTo: ["frontend/**/*.ts", "frontend/**/*.html", "frontend/**/*.scss"]
    excludes: ["**/*.spec.ts", "**/node_modules/**", "frontend/starter-web/lint-fixtures/**", "frontend/starter-web/tools/README.md"]
    fix: Fix the code instead. A justified exception is a module.rules.yaml exemption with a reason, reviewed by the platform owner.
  - id: base.no-hand-written-editorconfig
    description: A nested .editorconfig applies to every file below it, so a hand-written one can switch analyzers off or change thresholds for part of a module; the only nested ones are those the rules engine emits at each module root.
    pattern: '^[\s\S]'
    appliesTo: ["*/**/.editorconfig"]
    exemptEmittedFiles: true
    fix: Delete the file. Set analyzer severities and thresholds in the module.rules.yaml, then run node tools/rules-engine/compile.mjs.
  - id: base.no-fixture-gate-opt-out
    description: CodelabFixtureGateOptOut lets a build switch the quality gates off without CODELAB002; only the SDK's own fixture builds may pass it.
    pattern: '\bCodelabFixtureGateOptOut\b'
    flags: i
    appliesTo: ["**/*.cs", "**/*.csproj", "**/*.props", "**/*.targets", "**/*.rsp", "**/*.ps1", "**/*.mjs", "**/*.json"]
    excludes: ["packages/dotnet/Codelab.Build.Sdk/Sdk/Sdk.targets", "packages/dotnet/Codelab.Build.Analyzers.Tests/SdkFixture/**", "rules/**", "tools/rules-engine/tests/**"]
    fix: Remove it. The quality gates stay on for every project; fix the code instead.
  - id: base.no-hand-written-globalconfig
    description: Roslyn loads any .globalconfig it is given, at any global_level, so a hand-written one can raise the clean-code thresholds or switch rules off for a whole project; the only one is the generated rules/codelab.globalconfig.
    pattern: '^[\s\S]'
    appliesTo: ["**/*.globalconfig"]
    excludes: ["rules/codelab.globalconfig"]
    fix: Delete the file. Change thresholds in rules/base.rules.yaml or a module.rules.yaml, then run node tools/rules-engine/compile.mjs.
  - id: base.no-auto-generated-marker
    description: An auto-generated header makes every analyzer skip the file (CLB1001-CLB1005 ignore generated code), so hand-written code must not carry one.
    pattern: '^[ \t]*(?://|/\*)[^\r\n]*<auto-generated'
    flags: m
    appliesTo: ["**/*.cs"]
    fix: Remove the header. Real generator output is written under obj/ by the build and is never committed.
  - id: base.no-generated-file-name
    description: A *.g.cs, *.generated.cs or *.designer.cs name makes the analyzers treat a hand-written file as generated and skip it.
    pattern: '^[\s\S]'
    appliesTo: ["**/*.g.cs", "**/*.g.i.cs", "**/*.generated.cs", "**/*.designer.cs", "**/*.Designer.cs"]
    fix: Rename the file to a plain *.cs name. Generator output lives under obj/ and is never committed.
  - id: base.no-test-project-opt-in
    description: Only a *.Tests project is a test project (CLB1004 magic numbers skips test projects). Production code may not declare IsTestProject, reference a test framework (Microsoft.NET.Test.Sdk sets IsTestProject) or rename its assembly to *.Tests.
    pattern: '<IsTestProject>\s*true|<PackageReference\b[^>]*\bInclude\s*=\s*"(?:Microsoft\.NET\.Test\.Sdk|xunit|NUnit|MSTest)|<AssemblyName>[^<]*\.Tests?\s*<'
    flags: i
    appliesTo: ["**/*.csproj", "**/*.props", "**/*.targets"]
    excludes: ["**/*.Tests/**", "**/*.Tests.csproj"]
    fix: Put tests in a project named <Module>.Tests; production code never declares IsTestProject.
  - id: base.no-accept-any-certificate
    description: A certificate validator that accepts everything turns TLS into plain text for an attacker in the path (the harvest source's internal calls did this).
    pattern: '\bDangerousAcceptAnyServerCertificateValidator\b|(?:ServerCertificateCustomValidationCallback|RemoteCertificateValidationCallback|ServerCertificateValidationCallback)\s*[+]?=\s*(?:delegate\s*\([^)]*\)\s*\{\s*return\s+true\s*;\s*\}|(?:static\s+)?(?:\([^)]*\)|\w+)\s*=>\s*true\b)'
    appliesTo: ["**/*.cs"]
    fix: Keep certificate validation on. Trust an internal CA through Codelab.Integration's ServerCertificatePolicy (pinned or chain-validated), never by returning true.
  - id: base.no-threshold-override
    description: Clean-code thresholds (codelab_* keys) written by hand bypass the rules files and their review; only the files the rules engine emits, at their own paths (rules/codelab.globalconfig and each module's .editorconfig), may set them. A GENERATED marker in the content proves nothing.
    pattern: '(?:^|\n)[ \t]*codelab_\w+[ \t]*='
    appliesTo: ["**/.editorconfig", "**/*.globalconfig"]
    exemptEmittedFiles: true
    fix: Change the thresholds or settings in rules/base.rules.yaml or the module.rules.yaml, then run node tools/rules-engine/compile.mjs.

  # --- Magic strings used as keys ------------------------------------------------------------------
  - id: base.no-string-permission-key
    description: Permission keys passed as string literals drift from the permission catalog.
    pattern: '\b(?:HasPermission|RequirePermission|hasPermission)\(\s*[''"`]'
    appliesTo: ["**/*.cs", "**/*.ts"]
    excludes: ["**/*.spec.ts", "**/*.Tests/**"]
    fix: Use the typed permission constant (Permissions.<Area>.<Action> in C#, PermissionKeys.<KEY> in TypeScript).
  - id: base.no-string-role-check
    description: Role checks with string literals bypass the permission model.
    pattern: '\bIsInRole\(\s*"'
    appliesTo: ["**/*.cs"]
    fix: Check a permission with [HasPermission(Permissions.<Area>.<Action>)] instead of a role name.
  - id: base.no-string-config-key
    description: Configuration read by string key is untyped and unvalidated.
    pattern: '\bconfiguration\s*\[\s*"|\.GetSection\(\s*"|\.GetValue<[^>]+>\(\s*"'
    flags: i
    appliesTo: ["**/*.cs"]
    fix: Bind a typed options class with a SectionName constant and ValidateOnStart, then inject IOptions<T>.

  # --- Enums ---------------------------------------------------------------------------------------
  - id: base.enum-stored-as-int
    description: Enums stored or serialized as strings break when a member is renamed.
    pattern: 'HasConversion<string>\s*\(|\bEnumToStringConverter\b|\bJsonStringEnumConverter\b'
    appliesTo: ["**/*.cs"]
    fix: Keep the EF default (int column) and the numeric JSON value; the client maps numbers to i18n labels with the generated TS enum.
  # An early hook warning only: a text pattern cannot see past doc comments and attributes on a member. The build gate
  # is the CLB1005 analyzer (Codelab.Build.Analyzers), which matches the syntax.
  - id: base.enum-explicit-values
    description: An enum member without an explicit value changes meaning when members are reordered (CLB1005 is the build gate).
    pattern: '\benum\s+\w+(?:\s*:\s*\w+)?\s*\{(?:[^{}]*?[{,])?\s*[A-Za-z_]\w*\s*(?:,|\})'
    appliesTo: ["**/*.cs"]
    fix: Give every enum member an explicit numeric value, e.g. Draft = 1, Submitted = 2.

  # --- Architecture --------------------------------------------------------------------------------
  - id: base.no-dbcontext-in-api
    description: The Api layer must not touch the database directly.
    pattern: '\b\w*DbContext\b|\bSaveChanges(?:Async)?\b'
    appliesTo: ["**/Api/**/*.cs", "**/*.Api/**/*.cs", "**/*Controller.cs"]
    excludes: ["**/Composition/**", "**/Program.cs", "**/*.Tests/**"]
    fix: Call an Application use case; only the composition root registers the DbContext.
  - id: base.no-ef-in-application
    description: Application code must depend on ports, not on EF Core.
    pattern: '\busing\s+Microsoft\.EntityFrameworkCore\b|\b\w*DbContext\b'
    appliesTo: ["**/Application/**/*.cs", "**/*.Application/**/*.cs"]
    excludes: ["**/*.Tests/**"]
    fix: Declare a port (repository or IUnitOfWork interface) in Application and implement it in Infrastructure.
  - id: base.public-id-routes
    description: Raw numeric or Guid database ids in routes leak internal keys.
    pattern: '\{\w*[Ii]d:(?:int|long|guid)\}'
    appliesTo: ["**/*.cs"]
    fix: Take a PublicId route value ({id}) and resolve it in the Application layer.

  # --- Error handling and dead code ----------------------------------------------------------------
  - id: base.no-empty-catch
    description: An empty catch block hides failures.
    pattern: '\bcatch\s*(?:\([^)]*\))?\s*\{\s*\}'
    appliesTo: ["**/*.cs", "**/*.ts"]
    fix: Handle the error, or let it reach the global exception handler; log with the reference code when you rethrow.
  - id: base.no-commented-out-code
    description: Commented-out code is dead code; git keeps the history.
    pattern: '^\s*//\s*(?:var|let|const|if|for|foreach|while|return|await|public|private|using|import|throw)\b.*[;{]\s*$'
    flags: m
    appliesTo: ["**/*.cs", "**/*.ts"]
    fix: Delete the commented-out code.
    severity: warning

  # --- Frontend ------------------------------------------------------------------------------------
  - id: base.fe-http-via-api-service
    description: Feature code must not call HTTP directly.
    pattern: '\bHttpClient\b|\bfetch\s*\('
    appliesTo: ["**/*.ts"]
    excludes: ["**/core/http/**", "**/core/api/**", "**/*.spec.ts"]
    fix: Inject ApiService (or the generated API client) from core/api; it owns the base URL, auth and signing headers.
  - id: base.fe-no-hardcoded-paths
    description: Route and API paths typed as literals drift from the route and API catalogs.
    pattern: 'navigate(?:ByUrl)?\(\s*\[?\s*[''"`]/|[''"`]/api/'
    appliesTo: ["**/*.ts"]
    excludes: ["**/core/api/generated/**", "**/*.spec.ts"]
    fix: Use the typed route constants (AppRoutes) and the generated API client instead of path literals.
  # Same families as RESTRICTED_UI_LIBRARY_PATTERNS in @codelab/ng-tools (ESLint, CI); this twin lets the hook refuse
  # the edit early. Static imports, re-exports, side-effect imports and dynamic import() are all covered.
  - id: base.fe-ui-library-only
    description: Third-party UI kits and external DGA packages are not allowed (D5).
    pattern: '(?:\bfrom|\bimport)\s*\(?\s*[''"](?:@angular/material|primeng|primeicons|ng-zorro-antd|ngx-bootstrap|@ng-bootstrap/|@(?:dev-)?dga(?:-[a-z]+)?[/@''"]|@angular-material-components/|@swimlane/ngx-|@clr/|@progress/kendo-angular|devextreme-angular|@syncfusion/ej2-angular|@ionic/angular|@nebular/|@taiga-ui/|bootstrap(?:/|[''"]))'
    appliesTo: ["**/*.ts"]
    fix: Use the matching component from @codelab/ng-dga, or ask the platform owner to add one.
  # The non-TypeScript half of D5: a UI kit's stylesheet pulled in by @use/@import/@forward (with or without url(),
  # ~ or node_modules/), declared as a dependency in package.json, or listed in angular.json styles/scripts would
  # let its classes reach templates with no TS import. Same families as base.fe-ui-library-only; bootstrap is matched
  # only as a whole package name, so bootstrap-icons (ADR-009) stays allowed.
  # Also caught: Sass meta.load-css('<kit>') (any namespace, so `as m` + m.load-css too); a JSON string that names the
  # kit after a ':' or '/' inside it, which covers npm aliases ("ui-kit": "npm:bootstrap@5.3.3"), github:/git+https:
  # sources, tarball URLs and node_modules paths, so an alias cannot rename the kit past the rule.
  - id: base.fe-ui-library-styles-and-deps
    description: Third-party UI kit stylesheets, dependencies (including npm aliases) and angular.json styles/scripts are not allowed (D5).
    pattern: '(?:@(?:use|import|forward)\s+(?:url\(\s*)?[''"]?|\bload-css\(\s*[''"]?|"(?:[^"\s]*?[:/])?)~?(?:\.{1,2}/)*(?:node_modules/)?(?:@angular/material|primeng|primeicons|ng-zorro-antd|ngx-bootstrap|@ng-bootstrap/|@(?:dev-)?dga(?:-[a-z]+)?[/@''"]|@angular-material-components/|@swimlane/ngx-|@clr/|@progress/kendo-angular|devextreme-angular|@syncfusion/ej2-angular|@ionic/angular|@nebular/|@taiga-ui/|bootstrap(?:[/''"#@]|\.git\b))'
    appliesTo: ["**/*.scss", "**/*.css", "**/package.json", "**/angular.json"]
    fix: Remove the UI kit's stylesheet, dependency (or its npm alias) or angular.json entry and use @codelab/ng-dga components and tokens, or ask the platform owner to add one.
  # A stylesheet fetched from a CDN at run time would bring in any UI kit by URL (no package name to match), and the
  # servers have no egress (on-premises). Fonts and icons are self-hosted (ADR-009), so no remote stylesheet is needed.
  - id: base.fe-no-remote-stylesheet
    description: Stylesheets imported from a remote URL (CDN) are not allowed (D5, no egress).
    pattern: '(?:@(?:use|import|forward)\s+(?:url\(\s*)?|\bload-css\(\s*)[''"]?(?:https?:)?//'
    appliesTo: ["**/*.scss", "**/*.css"]
    fix: Install the stylesheet's package through the platform owner (or self-host the asset) and import it locally; UI kits stay refused (D5).
  # The hook twin of the ESLint boundary policy for the shared building blocks (shared, patterns and layouts reach
  # core and shared only): a relative import that climbs up to the app folder and into features/ is refused
  # (core/features is core, not a feature).
  - id: base.fe-shared-no-features
    description: Shared building blocks (shared/, patterns/, layouts/) must not import feature code.
    pattern: '(?:\bfrom|\bimport)\s*\(?\s*[''"](?:\.\./)+features/'
    appliesTo: ["**/src/app/shared/**/*.ts", "**/src/app/patterns/**/*.ts", "**/src/app/layouts/**/*.ts"]
    fix: Move what both need into shared/ (or core/), or pass it in through an input; a feature may import shared code, never the reverse.
  # Text between tags with at least one letter outside an HTML entity (&nbsp; and &times; are not text). A text
  # check cannot see raw text inside {{ }} or @if blocks or in attributes; the template AST lint is open (phase-log).
  - id: base.fe-raw-text-in-template
    description: Raw text in a template is not translated.
    pattern: '>(?:[^<>{}&\p{L}]|&#?[\p{L}\d]{1,10};)*\p{L}[^<>{}]*<'
    flags: u
    appliesTo: ["**/*.html"]
    excludes: ["**/showcase/**", "**/src/index.html"]
    fix: Add ar and en keys to the i18n files and use {{ 'feature.key' | translate }}.
  - id: base.fe-raw-text-in-inline-template
    description: Raw text in an inline component template is not translated.
    pattern: '\btemplate\s*:\s*(?:`[^`]*?|''[^'']*?|"[^"]*?)>(?:[^<>{}&`''"\p{L}]|&#?[\p{L}\d]{1,10};)*\p{L}[^<>{}`''"]*<'
    flags: u
    appliesTo: ["**/*.ts"]
    excludes: ["**/showcase/**", "**/*.spec.ts"]
    fix: Add ar and en keys to the i18n files and use {{ 'feature.key' | translate }} in the template.
  - id: base.fe-no-string-permission-key-in-template
    description: A permission key written as a string literal in a template gate drifts from the permission catalog (the template check refuses it too).
    pattern: '\[?\*?hasPermission\]?\s*=\s*"\s*[''`]'
    appliesTo: ["**/*.html", "**/*.ts"]
    excludes: ["**/*.spec.ts"]
    fix: Use the generated key, *hasPermission="PermissionKeys.<Key>" (docs/recipes/add-permission.md).
  - id: base.fe-logical-css
    description: Physical left/right properties break RTL.
    pattern: '\b(?:margin|padding|border)-(?:left|right)\b|(?:^|[\s;{])(?:left|right)\s*:|\btext-align\s*:\s*(?:left|right)\b|\bfloat\s*:\s*(?:left|right)\b'
    flags: m
    appliesTo: ["**/*.scss", "**/*.css"]
    fix: Use logical properties (margin-inline-start, inset-inline-end, text-align start/end).
  - id: base.fe-design-tokens
    description: Raw colours bypass the design tokens.
    pattern: '#[0-9a-fA-F]{3,8}\b|\brgba?\s*\('
    appliesTo: ["**/*.scss", "**/*.css"]
    excludes: ["**/tokens/**", "**/_tokens*.scss"]
    fix: Use a design token, e.g. var(--codelab-color-primary).

# DateTime.Now / UtcNow / Today, DateTimeOffset.Now / UtcNow and Thread.Sleep (both overloads, rule
# base.no-thread-sleep) are banned globally by Codelab.Build.Sdk's Sdk/BannedSymbols.txt, so every project gets them
# with or without a module.rules.yaml. The compiler refuses duplicates of that list; base-wide bans go there.
bannedSymbols: []

thresholds:
  # Enforced for C# since P1 (ADR-012) by Codelab.Build.Analyzers, shipped in Codelab.Build.Sdk: methodLines
  # (CLB1001), fileLines (CLB1002) and parameters (CLB1003), read from the codelab_* keys of the generated module
  # .editorconfig, or of rules/codelab.globalconfig for projects without a module.rules.yaml. cyclomaticComplexity is
  # CA1502 via CodeMetricsConfig.txt. ESLint rules from the same values arrive in P2.
  methodLines: 40
  fileLines: 400
  cyclomaticComplexity: 10
  parameters: 5
  # Declared, not yet enforced (ADR-012): no emitter or CI step reads the coverage thresholds yet (open after P2).
  backendLineCoverage: 80
  frontendLineCoverage: 70

analyzers:
  # Banned APIs are always build errors.
  RS0030: error
  # Codelab clean-code analyzers (ADR-012): method lines, file lines, parameters, magic numbers, enum member values.
  CLB1001: error
  CLB1002: error
  CLB1003: error
  CLB1004: error
  CLB1005: error
  # Cyclomatic complexity (threshold from thresholds.cyclomaticComplexity via CodeMetricsConfig.txt).
  CA1502: warning

recipes:
  - docs/standards/SKILL.md
