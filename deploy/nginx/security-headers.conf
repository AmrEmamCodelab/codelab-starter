# Security headers of the SPA front site, for an nginx front end (include it in the server block and in every
# location that has its own add_header: nginx drops the inherited add_header set as soon as a location adds one).
#
# The values equal the IIS template deploy/kits/templates/web/web.config, and both come from
# deploy/kits/templates/web/security-headers.psd1. deploy/kits/tests/SecurityHeaders.Parity.Tests.ps1 fails when
# they drift; change the .psd1 first, then this file and the web.config template.
#
# The CSP is report-only (reports go to the API's sink /api/security/csp-reports); docs/runbooks/csp-enforce.md
# switches it to Content-Security-Policy. "always" sends the headers on error responses too.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/security/csp-reports; report-to csp-endpoint" always;
add_header Reporting-Endpoints "csp-endpoint=\"/api/security/csp-reports\"" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self)" always;
add_header X-Frame-Options "DENY" always;
