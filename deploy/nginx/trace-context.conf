# Strips the caller's trace context before nginx proxies a request to a backend (the API, the attachment service):
# a caller must never choose the trace, or plant the baggage, the backend logs under. proxy_set_header with an empty
# value removes the header from the proxied request, so the backend starts its own trace.
#
# Include it in every location that has proxy_pass: like add_header, proxy_set_header is inherited only by a location
# that sets none of its own, and a proxying location always sets Host and X-Forwarded-*.
#
# The header list equals StrippedRequestHeaders in deploy/kits/templates/web/security-headers.psd1 and the
# "Strip inbound trace context" rule of the IIS template deploy/kits/templates/web/web.config;
# deploy/kits/tests/SecurityHeaders.Parity.Tests.ps1 fails when they drift. Change the .psd1 first.

proxy_set_header traceparent "";
proxy_set_header tracestate "";
proxy_set_header baggage "";
