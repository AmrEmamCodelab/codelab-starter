# Edge blocks of the SPA front site, for an nginx front end (include it in the server block, before any location that
# proxies /api). The front site never serves /api/internal/* or /api/ops/*: the gateway and the Ops Console API reach
# those routes through the API's own binding. Same paths and status as the "Block internal and ops API" rule in
# deploy/kits/templates/web/web.config (both from deploy/kits/templates/web/security-headers.psd1; parity test).
#
# nginx matches the normalized path ($uri: decoded, // merged with merge_slashes on); the second block refuses an
# encoded slash in the raw request line, which $uri would decode into a path the first block never sees.

location ~* ^/api/+(internal|ops)(/|$) {
    return 404;
}

if ($request_uri ~* "^/api/+(internal|ops)(/|%2f|$)") {
    return 404;
}
