# Extraction allowlist: the ONLY way source-product files enter the starter (ADR-001).
# Read by tools/extract/extract.ps1 (via extract-core.mjs), build-secret-digests.mjs and generate-source.mjs.
# Changing this file needs platform-owner review.
#
# Paths are relative to source.harvestRoot, forward slashes. Globs: "**" any depth, "*" within a segment,
# "{a,b}" alternation. hardDeny ALWAYS wins over an allowlisted entry; a pattern without "/" is tested against
# every path segment (folder or file name), so "*Yakeen*" also denies everything inside a Yakeen/ folder.
schemaVersion: 1

source:
  product: MODHS
  # Read-only git commands only (rev-parse, ls-tree). Nothing ever writes to this repository.
  repository: 'E:\MODHS'
  branch: dev_merge_sso
  commit: a6a4b1346c5f94cfc91c52749dfb5720a80e6c96
  treeHash: 5f0ef9e7e76a7fdb5e828108f1c86ab67e2f65d4
  # Durable read-only copy made with: git -C E:\MODHS -c core.autocrlf=false archive a6a4b134 (extracted, read-only).
  harvestRoot: 'E:\codelab-harvest\modhs-a6a4b134'

hardDeny:
  caseInsensitive:
    # Agent memory, session handoffs and deployment secrets of the source product.
    - '**/memory/**'
    - '.claude/handoffs/**'
    - '**/prep-deploy/REFERENCE.md'
    - 'deploy/config/*.json'
    - 'check-env-*'
    # National integrations are not harvested (later gateway profiles, written fresh).
    - 'services/nafath-service/**'
    - 'services/nic-simulator/**'
    - '*nafath*'
    - '*yakeen*'
    - 'ExternalUserMocked.cs'
    # The national identity-lookup ports, services, contracts and tests (verifier, lookup auditor, lookup token,
    # verification permissions and controller) are the same integration under neutral names (phase 2 review).
    - '*IdentityVerif*'
    - '*IdentityLookup*'
    # Phase 3: the national-ID fixtures behind the external sign-up, the evacuation-doctor role guard and the SSO
    # gateway-mode files (gateway SSO is phase 8, written fresh).
    - 'NinType*'
    - '*FlightDoctor*'
    - '*SsoGateway*'
    - 'GatewaySso*'
    - 'InternalSsoController.cs'
    # The dropped external DGA npm package (D5).
    - '*dev-dga*.tgz'
    # Key material and dependencies never come across.
    - '*.{pfx,p12,pem,key,snk}'
    - 'node_modules'
  caseSensitive:
    # Case-sensitive so Clinic*, Technical*, Mechanic* are not denied.
    - '*Nic*'
    - '{nic,*-nic,*.nic,*_nic}{-,.,_}*'

batches:
  p0:
    description: 'Phase 0: standards skills, the release-stamping reference, CLAUDE.md/CONTEXT.md structure.'
    entries:
      - id: skill-coding-standards
        source: '.claude/skills/coding-standards/**'
        target: '.claude/skills/coding-standards/'
        mode: copy
      - id: skill-do-work
        source: '.claude/skills/do-work/**'
        target: '.claude/skills/do-work/'
        mode: copy
      - id: skill-write-a-skill
        source: '.claude/skills/write-a-skill/**'
        target: '.claude/skills/write-a-skill/'
        mode: copy
      - id: release-stamping-reference
        source: 'backend/Directory.Build.props'
        target: 'reference/release-stamping/Directory.Build.props'
        mode: copy
      - id: claude-md-structure
        source: 'CLAUDE.md'
        target: 'reference/structure/CLAUDE.md'
        mode: headings-only
      - id: context-md-structure
        source: 'CONTEXT.md'
        target: 'reference/structure/CONTEXT.md'
        mode: headings-only

  # ---------------------------------------------------------------------------------------------------------------
  # Phase 1 inputs. One batch per wave-2 owner, so each owner promotes (rewrites) exactly one batch.
  # Staging targets live under reference/: they only lay out the staging folder. On promotion each origin entry's
  # target becomes the rewritten repo file and the staging path moves to stagedTarget (README "Promote a batch").
  # ---------------------------------------------------------------------------------------------------------------

  # The package spike (not a git commit): a durable read-only copy of the planning spike (src/ and sample/ without
  # bin/obj), pinned by contentDigest (lib/hashing.mjs contentDigest). extract-core refuses to copy when the folder
  # no longer matches. The three spike batches share this one source block (YAML anchor).
  pkg-spike-security:
    description: 'Phase 1 input (owner: security): the spike Codelab.Security package.'
    source: &pkgSpikeSource
      description: 'Package spike from the planning session, copied read-only on 2026-11-04'
      harvestRoot: 'E:\codelab-platform-private\harvest\pkg-spike-20261104'
      contentDigest: '9ad1460eeb38aa045053223d1d08d356e152b1b80bb09f211f026c59cbb901fa'
    entries:
      - id: pkg-spike-security-src
        source: 'src/Codelab.Security/**'
        target: 'reference/pkg-spike/src/Codelab.Security/'
        mode: copy

  pkg-spike-observability:
    description: 'Phase 1 input (owner: observability-errors): the spike Codelab.Observability package.'
    source: *pkgSpikeSource
    entries:
      - id: pkg-spike-observability-src
        source: 'src/Codelab.Observability/**'
        target: 'reference/pkg-spike/src/Codelab.Observability/'
        mode: copy

  pkg-spike-sample:
    description: 'Phase 1 input (owner: sample-and-release): the spike sample API and its package tests.'
    source: *pkgSpikeSource
    entries:
      - id: pkg-spike-sample
        source: 'sample/**'
        target: 'reference/pkg-spike/sample/'
        mode: copy

  # Harvest-commit batches. Test LOGIC only: no vector JSON, no vector/key fixture classes (the security vector
  # fixtures, the TS signature vector drivers), no key files, no appsettings. National-integration code (identity
  # verification throttle, gateway national profiles) is left out even where hard-deny would not catch the path.
  p1-security:
    description: 'Phase 1 input (owner: security): signing, PublicId, replay, headers, body ceiling, upload safety.'
    entries:
      # The SSO logout-hint store in the same folder is identity (phase 3), not the security core.
      - id: infrastructure-security
        source: 'backend/MODHS.Infrastructure/Security/{HmacProofVerifier,MemoryReplayGuard,PublicIdCodec,PublicIdKeyring,PublicIdKeyringOptions,ReplayProtectionOptions,RequestSigningOptions,SigningKeyring,SqlReplayGuard}.cs'
        target: 'reference/p1/Codelab.Security/infrastructure-security/'
        mode: copy
      # IdentityVerifyThrottle is the national identity-lookup throttle: not harvested.
      - id: api-security
        source: 'backend/MODHS.Api/Security/{ClientErrorRateLimits,ClientErrorUserThrottle,PublicIdBindingExtensions,PublicIdModelBinder,PublicIdModelBinderProvider,PublicIdRouteConstraint,PublicIdSchemaFilter,ResponseSigningOptions,SignatureExemptAttribute,SignedRequestBinding,ThrottleRefusal,UnsignedResponseAttribute,WireIdAllowlist}.cs'
        target: 'reference/p1/Codelab.Security/api-security/'
        mode: copy
      - id: api-middleware
        source: 'backend/MODHS.Api/Middleware/*.cs'
        target: 'reference/p1/Codelab.Security/api-middleware/'
        mode: copy
      - id: api-security-header-options
        source: 'backend/MODHS.Api/Services/SecurityHeaderOptions.cs'
        target: 'reference/p1/Codelab.Security/api-middleware/SecurityHeaderOptions.cs'
        mode: copy
      - id: api-body-ceiling
        source: 'backend/MODHS.Api/Filters/RefuseOversizedBodyAttribute.cs'
        target: 'reference/p1/Codelab.Security/api-filters/RefuseOversizedBodyAttribute.cs'
        mode: copy
      - id: upload-receipts
        source: 'services/attachment-service/MODHS.Attachments.API/Services/{IReceiptSigner,ReceiptSigner}.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/receipts/'
        mode: copy
      - id: upload-magic-bytes
        source: 'services/attachment-service/MODHS.Attachments.Infrastructure/{Implementations/FileExtensionValidatorService,Interfaces/IFileExtensionValidatorService}.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/magic-bytes/'
        mode: copy
      - id: upload-caps-options
        source: 'services/attachment-service/MODHS.Attachments.DTOs/ApplicationSettings/FileStorage.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/caps/FileStorage.cs'
        mode: copy
      - id: upload-caps-refusals
        source: 'services/attachment-service/MODHS.Attachments.DTOs/Exceptions/UploadValidationException.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/caps/UploadValidationException.cs'
        mode: copy
      - id: upload-caps-enforcement
        source: 'services/attachment-service/MODHS.Attachments.API/Services/MultiFileUploadService.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/caps/MultiFileUploadService.cs'
        mode: copy
      - id: upload-path-containment
        source: 'services/attachment-service/MODHS.Attachments.Utilities/Helpers/UploadHelper.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/path-containment/UploadHelper.cs'
        mode: copy
      - id: upload-safety-tests
        source: 'services/attachment-service/tests/MODHS.Attachments.Tests/{ReceiptSignerTests,FileExtensionValidatorServiceTests,UploadHelperTests,UploadValidationExceptionTests,MultiFileUploadServiceTests,Testing/TestReceipts,Testing/TestFiles}.cs'
        target: 'reference/p1/Codelab.Security/upload-safety/tests/'
        mode: copy
      - id: security-tests-application
        source: 'backend/MODHS.Application.Tests/SecurityKeyringValidatorTests.cs'
        target: 'reference/p1/Codelab.Security/tests/SecurityKeyringValidatorTests.cs'
        mode: copy
      - id: security-tests-api
        source: 'backend/MODHS.Api.Tests/{SecurityHeadersMiddlewareTests,HmacProofVerifierTests,PublicIdModelBindingTests,PublicIdRouteConstraintTests,PublicIdJsonContractTests,PublicIdCodecContractTests,RequestSignatureContractTests,SignatureLayerIntegrationTests,SignatureExemptionContractTests,SessionSigningKeyContractTests,WireIdKeyringGuardTests,WireIdAllowlistContractTests,ClientErrorUserThrottleTests,WireCryptoSurface,RecordingResponseFeature}.cs'
        target: 'reference/p1/Codelab.Security/tests/'
        mode: copy
      - id: security-tests-integration
        source: 'backend/MODHS.IntegrationTests/{SecurityHeaderTests,SignedRequestEnforcementTests,CorsPreflightTests,RequestBodyLimitPipelineTests}.cs'
        target: 'reference/p1/Codelab.Security/tests/integration/'
        mode: copy

  p1-observability-errors:
    description: 'Phase 1 input (owner: observability-errors): shared observability library, API diagnostics and classifiers.'
    entries:
      - id: observability-library
        source: 'shared/Modhs.Observability/**'
        target: 'reference/p1/Codelab.Observability/library/'
        mode: copy
      - id: observability-tests
        source: 'shared/Modhs.Observability.Tests/**'
        target: 'reference/p1/Codelab.Observability/tests/'
        mode: copy
      - id: api-diagnostics
        source: 'backend/MODHS.Api/Diagnostics/**'
        target: 'reference/p1/Codelab.Errors/api-diagnostics/'
        mode: copy
      # The client-error message-shape VECTOR test is left out (vectors are regenerated in wave 3).
      - id: diagnostics-tests-api
        source: 'backend/MODHS.Api.Tests/{FailureClassifierTests,JobFailureLogFilterTests,ErrorEnvelopeLeakTests,RequestBodyLimitClassifierTests,DuplicateFailureEventFilterTests,ExceptionHandledEnricherTests,CustomizeProblemDetailsCollisionTests,PropagationScopeContractTests,PiiSafeSpanProcessorTests,StepSpanCatalogueTests,ClientErrorsControllerTests}.cs'
        target: 'reference/p1/Codelab.Errors/tests/'
        mode: copy
      - id: diagnostics-tests-integration
        source: 'backend/MODHS.IntegrationTests/{ErrorEnvelopeConsistencyTests,CorrelationIdLoggingTests,FailureLoggingTests}.cs'
        target: 'reference/p1/Codelab.Errors/tests/integration/'
        mode: copy

  p1-integration:
    description: 'Phase 1 input (owner: integration-testing): the outbound engine for Codelab.Integration 0.1.'
    entries:
      - id: integration-abstractions
        source: 'services/integration-gateway/src/Integration.Abstractions/**'
        target: 'reference/p1/Codelab.Integration/abstractions/'
        mode: copy
      - id: integration-core
        source: 'services/integration-gateway/src/Integration.Core/**'
        target: 'reference/p1/Codelab.Integration/core/'
        mode: copy
      # Engine tests: dispatch, configuration/wiring, interpretation (failure classification), observability
      # redaction, pipeline, resilience (retry/timeout) and the pinned engine edits.
      - id: engine-tests
        source: 'services/integration-gateway/tests/IntegrationGateway.Tests/{Vendored,VendoredEdits}/**'
        target: 'reference/p1/Codelab.Integration/tests/'
        mode: copy
      # Certificate validation: the outbound handler must keep the platform's validation (no custom callback).
      - id: cert-validation-tests
        source: 'services/integration-gateway/tests/IntegrationGateway.Tests/Gateway/GatewayAssertionTests.cs'
        target: 'reference/p1/Codelab.Integration/tests/cert-validation/GatewayAssertionTests.cs'
        mode: copy

  p1-testing:
    description: 'Phase 1 input (owner: integration-testing): architecture, layering, source-sweep and contract test logic.'
    entries:
      - id: layering-and-sweep-tests
        source: 'backend/MODHS.Application.Tests/{SecurityLayeringTests,SeraDefectSourceSweepTests}.cs'
        target: 'reference/p1/Codelab.Testing/application-tests/'
        mode: copy
      - id: contract-tests-api
        source: 'backend/MODHS.Api.Tests/{AccountSecurityContractTests,ControllerAuthorizationCoverageTests,ControllerActionModelTests,NumericIdBurndownTests,AppsettingsSecretHygieneContractTests,LogTemplatePiiContractTests}.cs'
        target: 'reference/p1/Codelab.Testing/api-tests/'
        mode: copy
      - id: contract-tests-integration
        source: 'backend/MODHS.IntegrationTests/NumericIdWireSweepTests.cs'
        target: 'reference/p1/Codelab.Testing/integration-tests/NumericIdWireSweepTests.cs'
        mode: copy

  p1-ng-security:
    description: 'Phase 1 input (owner: npm-packages): the SPA signing, canonical framing, wire ids and API error parser.'
    entries:
      - id: ng-core-security
        source: 'frontend/modhs-web/src/app/core/security/**'
        target: 'reference/p1/ng-security/security/'
        mode: copy
      - id: ng-api-error
        source: 'frontend/modhs-web/src/app/core/http/{api-error,api-error.spec}.ts'
        target: 'reference/p1/ng-security/http/'
        mode: copy

  # ---------------------------------------------------------------------------------------------------------------
  # Phase 2 inputs (walking skeleton). One batch per later owner: p2-backend (wave 2 backend), p2-frontend (wave 3
  # frontend), p2-ng-dga (wave 2 ng-dga), p2-aikit (wave 1). Every file is a REWRITE reference: nothing is copied whole.
  # Leave-behind (plan, phase 2): the national-SSO controller, proxy client and options, and the national-SSO
  # branches inside the auth controller, session issuer, auth payload, login and feature contracts, signature-exempt
  # usages and the audit context accessor; in the SPA the national-SSO service, its branches in the auth service,
  # models, SSO helper and feature store, the login tab with its polling, and its i18n text. Hard-deny keeps the
  # national-integration FILES out; the branches inside allowlisted files are dropped by the rewrite, and the
  # scrub sweep blocks any leftover.
  # ---------------------------------------------------------------------------------------------------------------
  p2-backend:
    description: 'Phase 2 input (owner: wave 2 backend): kernel ports, authorization, basic login, session issuer, feature flags.'
    entries:
      # Read to split into AddXxx/UseXxx composition extensions; never copied whole (the 2,243-line defect).
      - id: api-program
        source: 'backend/MODHS.Api/Program.cs'
        target: 'reference/p2/backend/api/Program.cs'
        mode: copy
      - id: api-authorization
        source: 'backend/MODHS.Api/Authorization/{HasPermissionAttribute,PermissionHandler,CurrentUserContext,ICurrentUserContext,HttpAuditContextAccessor,AuthPayload}.cs'
        target: 'reference/p2/backend/api/authorization/'
        mode: copy
      - id: infrastructure-authorization
        source: 'backend/MODHS.Infrastructure/Authorization/{UserPermissionResolver,PermissionSynchronizer}.cs'
        target: 'reference/p2/backend/infrastructure/authorization/'
        mode: copy
      # The user store is renamed on rewrite; hard-deny keeps every national-SSO file of the folder out.
      - id: infrastructure-identity
        source: 'backend/MODHS.Infrastructure/Identity/**'
        target: 'reference/p2/backend/infrastructure/identity/'
        mode: copy
      # The kernel ports (unit of work, current language, audit context, permission resolver, clock -> TimeProvider).
      # Hard-deny keeps the national identity-lookup ports out.
      - id: domain-abstractions
        source: 'backend/MODHS.Domain/Abstractions/**'
        target: 'reference/p2/backend/domain/abstractions/'
        mode: copy
      # The permission catalog in code (rewritten as per-module <Name>PermissionKeys).
      - id: domain-permission-catalog
        source: 'backend/MODHS.Domain/Constants/Permissions.cs'
        target: 'reference/p2/backend/domain/constants/Permissions.cs'
        mode: copy
      # Feature flags only: the anonymous endpoint discloses flags, never identities.
      - id: feature-flags
        source: 'backend/MODHS.Api/{Services/FeatureOptions,Services/FeatureGate,Controllers/FeaturesController,Contracts/FeatureContracts}.cs'
        target: 'reference/p2/backend/api/features/'
        mode: copy
      # Basic login only (one session issuer, sid claim, rotated refresh token, logout revokes the sid).
      - id: auth-login
        source: 'backend/MODHS.Api/{Controllers/AuthController,Services/LoginSessionIssuer,Services/TokenService,Contracts/LoginContracts}.cs'
        target: 'reference/p2/backend/api/auth/'
        mode: copy
      - id: current-language
        source: 'backend/MODHS.Api/Services/ScopedCurrentLanguage.cs'
        target: 'reference/p2/backend/api/services/ScopedCurrentLanguage.cs'
        mode: copy
      # Test references for the classes above (logic only; fixtures are rewritten with starter-only values).
      - id: tests-api
        source: 'backend/MODHS.Api.Tests/{PermissionHandlerTests,HttpAuditContextAccessorTests,TokenServiceTests,TokenClaimContractTests,LoginRejectionContractTests,AuthUserPayloadContractTests,FeatureGateConventionTests,FeatureSwitchContractTests,ControllerPermissionAttributeTests}.cs'
        target: 'reference/p2/backend/tests/api/'
        mode: copy
      - id: tests-application
        source: 'backend/MODHS.Application.Tests/PermissionCatalogTests.cs'
        target: 'reference/p2/backend/tests/application/PermissionCatalogTests.cs'
        mode: copy
      - id: tests-integration
        source: 'backend/MODHS.IntegrationTests/{Uc001InternalLoginTests,PermissionEnforcementTests,PermissionCacheResilienceTests,FeatureSwitchEndpointTests}.cs'
        target: 'reference/p2/backend/tests/integration/'
        mode: copy

  p2-frontend:
    description: 'Phase 2 input (owner: wave 3 frontend): SPA core (api, config, auth, http, i18n), staff shell, login, 404/403, i18n.'
    entries:
      - id: core-api-config
        source: 'frontend/modhs-web/src/app/core/{api.service.ts,api.service.spec.ts,app-config.service.ts}'
        target: 'reference/p2/frontend/core/'
        mode: copy
      # Hard-deny keeps the national-SSO service out; its branches in the other files are dropped by the rewrite.
      - id: core-auth
        source: 'frontend/modhs-web/src/app/core/auth/**'
        target: 'reference/p2/frontend/core/auth/'
        mode: copy
      - id: core-http
        source: 'frontend/modhs-web/src/app/core/http/**'
        target: 'reference/p2/frontend/core/http/'
        mode: copy
      - id: core-i18n
        source: 'frontend/modhs-web/src/app/core/i18n/**'
        target: 'reference/p2/frontend/core/i18n/'
        mode: copy
      - id: core-config
        source: 'frontend/modhs-web/src/app/core/config/**'
        target: 'reference/p2/frontend/core/config/'
        mode: copy
      # Inventory only: the developer autofill tool lands in phase 7.
      - id: core-dev-inventory
        source: 'frontend/modhs-web/src/app/core/dev/**'
        target: 'reference/p2/frontend/core/dev/'
        mode: copy
      - id: layout-shell
        source: 'frontend/modhs-web/src/app/shared/layout/{app-shell,language-switcher,user-profile-menu}.component*'
        target: 'reference/p2/frontend/layouts/'
        mode: copy
      # Basic tab only; the national-SSO tab and its polling are left behind.
      - id: login
        source: 'frontend/modhs-web/src/app/features/auth/login/**'
        target: 'reference/p2/frontend/features/auth/login/'
        mode: copy
      - id: error-pages
        source: 'frontend/modhs-web/src/app/shared/components/{not-found,unauthorized}/**'
        target: 'reference/p2/frontend/features/errors/'
        mode: copy
      - id: i18n-bundles
        source: 'frontend/modhs-web/src/{assets/i18n,i18n-protected}/{ar,en}.json'
        target: 'reference/p2/frontend/i18n/'
        mode: copy
      # Rewrite references only: the starter files reference @codelab/ng-dga, never the external DGA package.
      - id: app-build-references
        source: 'frontend/modhs-web/{src/styles.scss,angular.json,package.json}'
        target: 'reference/p2/frontend/app/'
        mode: copy

  p2-ng-dga:
    description: 'Phase 2 input (owner: wave 2 ng-dga): the DGA components ported into @codelab/ng-dga 0.1.'
    entries:
      - id: dga-components
        source: 'frontend/modhs-web/src/app/shared/ui/dga/**'
        target: 'reference/p2/ng-dga/components/'
        mode: copy

  p2-aikit:
    description: 'Phase 2 input (owner: wave 1 harvest-aikit): material behind AI kit v1 (reviewers, bug verifier, commit gate).'
    entries:
      - id: agent-commit-gate
        source: '.claude/agents/commit-gate.md'
        target: 'reference/p2/aikit/agents/commit-gate.md'
        mode: copy
      - id: agent-bug-verifier
        source: '.claude/agents/bug-verifier.md'
        target: 'reference/p2/aikit/agents/bug-verifier.md'
        mode: copy
      # Behind standards-reviewer (the starter's own docs/standards already carries the rewritten skill).
      - id: standards-material
        source: '.claude/skills/coding-standards/**'
        target: 'reference/p2/aikit/standards/'
        mode: copy
      # Behind security-reviewer: account security, SPA headers, the wire-id cutover.
      - id: security-material
        source: 'docs/security/{account-security,spa-headers,wire-id-cutover}.md'
        target: 'reference/p2/aikit/security/'
        mode: copy

  # ---------------------------------------------------------------------------------------------------------------
  # Phase 3 inputs (identity and access). One batch per phase 3 builder; each builder rewrites from the staging copy
  # with starter names and writes only its own provenance/origins/<batch>.json. Every file is a REWRITE reference.
  # Leave-behind (plan, phase 3): every national-SSO branch, controller, service, tab and polling; the national-ID
  # fixtures (hard-denied by name); the evacuation-doctor role guard and its screens; SSO gateway mode (phase 8).
  # National branches inside allowlisted files are dropped by the rewrite, and the scrub sweep blocks any leftover.
  # ---------------------------------------------------------------------------------------------------------------
  p3-identity-pkg:
    description: 'Phase 3 input (owner: identity-pkg): LDAP directory sign-in and OIDC id_token validation for Codelab.Identity 0.5.'
    entries:
      - id: active-directory
        source: 'backend/MODHS.Infrastructure/ActiveDirectory/**'
        target: 'reference/p3/identity-pkg/active-directory/'
        mode: copy
      # Direct-mode OIDC only; gateway-mode files are hard-denied by name.
      - id: oidc
        source: 'backend/MODHS.Infrastructure/Sso/**'
        target: 'reference/p3/identity-pkg/oidc/'
        mode: copy
      - id: tests-api
        source: 'backend/MODHS.Api.Tests/{ActiveDirectoryDeploymentGuardTests,LdapAuthenticatorTests,NamIdTokenValidatorTests,NamOidcIdentityProviderTests,SsoDeploymentGuardTests,SsoDeploymentContractTests}.cs'
        target: 'reference/p3/identity-pkg/tests/'
        mode: copy
      - id: tests-integration
        source: 'backend/MODHS.IntegrationTests/ActiveDirectoryStartupGuardTests.cs'
        target: 'reference/p3/identity-pkg/tests/integration/ActiveDirectoryStartupGuardTests.cs'
        mode: copy

  p3-identity-accounts:
    description: 'Phase 3 input (owner: identity-accounts): account provisioning, lockout and the auth-event trail.'
    entries:
      - id: auth-event-sink
        source: 'backend/MODHS.Infrastructure/Auditing/EfAuthEventSink.cs'
        target: 'reference/p3/identity-accounts/auditing/EfAuthEventSink.cs'
        mode: copy
      - id: auth-event-model
        source: 'backend/MODHS.{Domain/Abstractions/IAuthEventSink,Domain/Constants/AuthEventTypes,Domain/Entities/Auditing/AuthEvent,Infrastructure/Data/Configurations/AuthEventConfiguration}.cs'
        target: 'reference/p3/identity-accounts/auditing/model/'
        mode: copy
      - id: account-provisioner
        source: 'backend/MODHS.Infrastructure/Authorization/UserAccountProvisioner.cs'
        target: 'reference/p3/identity-accounts/accounts/UserAccountProvisioner.cs'
        mode: copy
      # The lockout settings; the lockout code path itself is in the auth controller (batch p3-identity-login-modes).
      - id: lockout-options
        source: 'backend/MODHS.Api/Services/AccountLockoutOptions.cs'
        target: 'reference/p3/identity-accounts/lockout/AccountLockoutOptions.cs'
        mode: copy
      - id: tests-integration
        source: 'backend/MODHS.IntegrationTests/AuthEventTrailTests.cs'
        target: 'reference/p3/identity-accounts/tests/integration/AuthEventTrailTests.cs'
        mode: copy

  p3-identity-login-modes:
    description: 'Phase 3 input (owner: identity-login-modes): AD and SSO sign-in endpoints, the SSO exchange ticket and SSO logout.'
    entries:
      # Reference only: the national-SSO branches are left behind on rewrite.
      - id: controllers
        source: 'backend/MODHS.Api/Controllers/{SsoController,AuthController}.cs'
        target: 'reference/p3/identity-login-modes/controllers/'
