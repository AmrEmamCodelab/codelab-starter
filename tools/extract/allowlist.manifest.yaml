secretDigests:
  # Values found here are hashed (SHA-256) into tools/extract/secret-digests.json; the values are never stored.
  output: 'tools/extract/secret-digests.json'
  configFiles: ['**/appsettings*.json']
  vectorFiles: ['docs/security/*.vectors.json', '**/testing/security/*.vectors.json']
  fixtureFiles: ['**/*Tests/**/*.cs', '**/*.spec.ts', '**/testing/security/*.ts']
  # Secret-shaped values (quoted or unquoted) in compose files, CI workflows, scripts, SQL and dev settings.
  scriptFiles: ['**/docker-compose*.yml', '**/docker-compose*.yaml', '.github/workflows/*.yml', '.github/workflows/*.yaml', '**/*.ps1', '**/*.psm1', '**/*.sql', '**/launchSettings.json', '**/environment*.ts', '**/.env', '**/.env.*']
